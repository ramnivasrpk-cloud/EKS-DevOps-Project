apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
      - name: nodejs-app
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/nodejs-app:latest

        ports:
        - containerPort: 3000

        envFrom:
        - secretRef:
            name: app-secret

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"
