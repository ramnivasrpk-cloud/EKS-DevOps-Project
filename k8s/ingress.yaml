apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: nodejs-ingress
  namespace: production

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx

  rules:
  - host: app.example.com

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: nodejs-service
            port:
              number: 80
